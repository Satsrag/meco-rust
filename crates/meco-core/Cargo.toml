[package]
name = "meco-core"
version = "0.3.1"
edition.workspace = true
license.workspace = true
rust-version = "1.82"
description = "Mongolian Encoding Converter — pure-by-default Rust library and CLI, ported from Java meco."
readme = "README.md"
repository = "https://github.com/Satsrag/meco-rust"
homepage = "https://github.com/Satsrag/meco-rust"
documentation = "https://docs.rs/meco-core"

[lib]
name = "meco_core"

[[bin]]
name = "meco"
path = "src/bin/meco.rs"

[features]
default = []
# Deprecated no-op kept so existing `--features utn57-command` builds keep working. UTN #57
# output is always available since 0.3.0: the backend is pure Rust and linked into the core.
utn57-command = []

[dependencies]
# Pure-Rust ZVVNMOD → UTN #57 conversion (no subprocess, no Python, wasm32 compatible).
zvvnmod-utn57 = "=0.1.0"
