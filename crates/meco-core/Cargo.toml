[package]
name = "meco-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Mongolian Encoding Converter — pure Rust core, ported from the Java meco library. Java is the authoritative behavior oracle; PHP is reference-only."

[lib]
name = "meco_core"

[features]
default = []
utn57-command = ["dep:zvvnmod-utn57"]

[dependencies]
zvvnmod-utn57 = { version = "=0.1.0-alpha.3", optional = true }
